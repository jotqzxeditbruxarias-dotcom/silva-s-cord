<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12"><meta name="description" content="Silva's Cord — comunidades, canais e conversas.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>Silva's Cord</title>
<style>
:root{--bg:#090a0f;--panel:#11131b;--panel2:#181b25;--line:#272b38;--text:#f2f3f7;--muted:#9da3b5;--accent:#8b5cf6;--accent2:#5b8cff;--danger:#ef4444;--ok:#35d07f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;max-width:1180px;margin:auto;display:flex;overflow:hidden;background:var(--bg)}
.rail{width:72px;background:#08090e;border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:9px}.server{width:56px;height:56px;border:0;border-radius:17px;background:var(--panel2);color:white;font-weight:800;font-size:17px}.server.active,.server:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px}.add{color:var(--ok)}
.side{width:235px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.sidehead{padding:18px;font-weight:800;border-bottom:1px solid var(--line)}.section{padding:15px 12px 5px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.channel,.dm{border:0;background:transparent;color:var(--muted);padding:10px 15px;text-align:left;width:100%;border-radius:8px}.channel:hover,.dm:hover,.channel.active{background:var(--panel2);color:white}.sidebottom{margin-top:auto;padding:10px;background:#0d0f16;display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:64px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);gap:12px}.top h2{font-size:16px;margin:0}.spacer{flex:1}.iconbtn{background:transparent;border:0;color:var(--muted);font-size:20px;padding:8px}.content{flex:1;overflow:auto}.hero{padding:34px 24px;background:radial-gradient(circle at 85% 20%,#30205d 0,transparent 42%),linear-gradient(135deg,#11131b,#0b0d13);border-bottom:1px solid var(--line)}.hero h1{font-size:32px;margin:0 0 8px}.hero p{color:var(--muted);max-width:650px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.card h3{margin-top:0}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#211c39;color:#cbbcff;font-size:12px}
.messages{padding:18px 22px}.msg{display:flex;gap:12px;margin:18px 0}.msgbody{max-width:760px}.msghead{font-weight:700}.msghead span{font-weight:400;color:var(--muted);font-size:11px;margin-left:7px}.bubble{margin-top:5px;color:#d9dce5;line-height:1.45}.mention{color:#c7b5ff}.composer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#0d0f16}.composer input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px;color:white;outline:none}.send{background:var(--accent);border:0;border-radius:10px;color:white;padding:0 18px}
.panel{padding:22px;max-width:800px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{background:var(--panel2);border:1px solid var(--line);color:white;padding:12px;border-radius:9px;outline:none}.primary{background:var(--accent);color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:700}.danger{background:#35161a;color:#ff9b9b;border:1px solid #5d2228}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:20}.modal.show{display:grid}.modalbox{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#202532;padding:11px 15px;border-radius:10px;display:none;z-index:30}
.bottom{display:none}
@media(max-width:760px){
.rail{width:64px}.side{position:absolute;left:64px;top:0;bottom:0;width:245px;z-index:10;transform:translateX(-110%);transition:.2s;box-shadow:10px 0 30px #0008}.side.open{transform:none}.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.bottom{display:flex;height:62px;border-top:1px solid var(--line);background:#0d0f16;justify-content:space-around;align-items:center}.bottom button{background:none;border:0;color:var(--muted);font-size:12px}.bottom b{display:block;font-size:20px}.top{height:58px}.hero h1{font-size:27px}.messages{padding:12px 14px}.composer{padding:9px}.send{padding:0 14px}.app{max-width:none}}
</style></head>
<body>
<div class="app">
<aside class="rail">
<button class="server active" title="Início" onclick="home()">SC</button>
<button class="server" title="Silva's Hub" onclick="selectServer('Silva’s Hub')">S</button>
<button class="server" title="Games" onclick="selectServer('Games')">G</button>
<button class="server add" title="Criar servidor" onclick="modal('server')">+</button>
</aside>
<aside id="sidebar" class="side">
<div class="sidehead" id="serverName">Silva's Cord</div>
<div class="section">Canais</div>
<button class="channel active" onclick="channel('geral')"># geral</button>
<button class="channel" onclick="channel('anuncios')"># anúncios</button>
<button class="channel" onclick="channel('memes')"># memes</button>
<div class="section">Voz</div>
<button class="channel" onclick="toast('Canal de voz: integração de áudio será adicionada no backend.')">🔊 Sala principal</button>
<div class="section">Mensagens</div>
<button class="dm" onclick="dm('Biel')">● Biel</button>
<button class="dm" onclick="dm('João')">● João</button>
<div class="sidebottom"><div class="avatar">S</div><div><b id="userName">Silva</b><div class="muted" style="font-size:11px">online</div></div><button class="iconbtn" onclick="settings()">⚙</button></div>
</aside>
<main class="main">
<header class="top"><button class="iconbtn" onclick="toggleSide()">☰</button><h2 id="pageTitle">Início</h2><div class="spacer"></div><button class="iconbtn" onclick="friends()">👥</button><button class="iconbtn" onclick="profile()">◉</button></header>
<div id="content" class="content"></div>
<nav class="bottom"><button onclick="home()"><b>⌂</b>Início</button><button onclick="toggleSide()"><b>☰</b>Canais</button><button onclick="friends()"><b>♧</b>Amigos</button><button onclick="settings()"><b>⚙</b>Config.</button></nav>
</main></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);
let currentChannel='geral', messages=JSON.parse(localStorage.getItem('sc_messages')||'[]');
function save(){localStorage.setItem('sc_messages',JSON.stringify(messages))}
function toggleSide(){$('#sidebar').classList.toggle('open')}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2300)}
function home(){ $('#pageTitle').textContent='Início'; $('#content').innerHTML=`<section class="hero"><span class="pill">BETA • SILVA'S CORD</span><h1>Seu espaço. Sua comunidade.</h1><p>Converse, crie comunidades e personalize sua experiência em uma interface feita para celular.</p><div class="row"><button class="primary" onclick="modal('server')">＋ Criar servidor</button><button class="primary" onclick="friends()">Adicionar amigos</button></div></section><section class="cards"><div class="card"><h3>💬 Conversas</h3><p class="muted">Mensagens, respostas, reações e menções.</p></div><div class="card"><h3>🛡️ Moderação</h3><p class="muted">Cargos, permissões, denúncias e registros.</p></div><div class="card"><h3>🎨 Personalização</h3><p class="muted">Temas, banners, badges e decoração.</p></div></section>`}
function selectServer(n){$('#serverName').textContent=n;toast('Servidor selecionado: '+n);channel('geral')}
function channel(n){currentChannel=n;$('#pageTitle').textContent='# '+n;$('#content').innerHTML=`<div class="messages" id="messages"></div><form class="composer" onsubmit="send(event)"><input id="message" autocomplete="off" placeholder="Mensagem em #${n}"><button class="send">Enviar</button></form>`;renderMessages()}
function dm(n){$('#pageTitle').textContent=n;$('#content').innerHTML=`<div class="messages" id="messages"><div class="msg"><div class="avatar">${n[0]}</div><div class="msgbody"><div class="msghead">${n}<span>agora</span></div><div class="bubble">Olá! 👋 Esta é uma conversa privada de demonstração.</div></div></div></div><form class="composer" onsubmit="sendDM(event,'${n}')"><input id="message" placeholder="Mensagem para ${n}"><button class="send">Enviar</button></form>`}
function renderMessages(){let list=messages.filter(x=>x.channel===currentChannel);$('#messages').innerHTML=list.map(x=>`<div class="msg"><div class="avatar">${x.user[0]}</div><div class="msgbody"><div class="msghead">${x.user}<span>${x.time}</span></div><div class="bubble">${x.text.replace(/@(\w+)/g,'<span class="mention">@$1</span>')}</div></div></div>`).join('')||'<p class="muted">Nenhuma mensagem ainda. Comece a conversa!</p>'}
function send(e){e.preventDefault();let v=$('#message').value.trim();if(!v)return;messages.push({channel:currentChannel,user:'Silva',text:v,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});save();renderMessages();$('#message').focus()}
function sendDM(e,n){e.preventDefault();let v=$('#message').value.trim();if(v){toast('Mensagem enviada para '+n+' (modo local)');$('#message').value=''}}
function friends(){$('#pageTitle').textContent='Amigos';$('#content').innerHTML=`<div class="panel"><h1>Amigos</h1><p class="muted">Gerencie seus contatos e solicitações.</p><div class="card"><div class="row"><div class="avatar">B</div><div style="flex:1"><b>Biel</b><div class="muted">online</div></div><button class="primary" onclick="dm('Biel')">Mensagem</button></div></div><div class="card" style="margin-top:12px"><h3>Adicionar amigo</h3><div class="row"><input id="friend" placeholder="nome de usuário" style="flex:1;background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:9px;color:white"><button class="primary" onclick="toast('Solicitação enviada (modo local)')">Enviar</button></div></div></div>`}
function profile(){$('#pageTitle').textContent='Perfil';$('#content').innerHTML=`<div class="panel"><h1>Perfil</h1><div class="card"><div class="row"><div class="avatar" style="width:72px;height:72px">S</div><div><h2 id="pname">Silva</h2><div class="muted">Online • #0001</div></div></div><p>Construindo o Silva's Cord 🚀</p><span class="pill">OWNER</span></div><div class="card" style="margin-top:14px"><h3>Decoração</h3><p class="muted">Banner, moldura, badges e efeitos ficam disponíveis conforme o sistema de personalização for conectado ao backend.</p></div></div>`}
function settings(){$('#pageTitle').textContent='Configurações';$('#content').innerHTML=`<div class="panel"><h1>Configurações</h1><div class="card"><h3>Conta</h3><div class="formgrid"><label class="field"><span>Nome</span><input value="Silva"></label><label class="field"><span>Status</span><select><option>Online</option><option>Ausente</option><option>Ocupado</option><option>Invisível</option></select></label><label class="field full"><span>Biografia</span><textarea rows="3">Construindo o Silva's Cord 🚀</textarea></label></div></div><div class="card" style="margin-top:14px"><h3>Aparência</h3><p class="muted">Tema escuro ativo. Cores e temas personalizados podem ser conectados ao perfil.</p><button class="primary" onclick="toast('Tema salvo')">Salvar aparência</button></div><div class="card" style="margin-top:14px"><h3>Segurança</h3><p class="muted">Nesta versão local, não há autenticação real. Em produção, senhas e permissões devem ser validadas no servidor.</p></div><div class="card" style="margin-top:14px"><h3>👑 Owner / Silva</h3><p class="muted">Painel separado para administração global.</p><button class="primary" onclick="owner()">Abrir painel Owner</button></div></div>`}
function owner(){$('#pageTitle').textContent='Owner / Silva';$('#content').innerHTML=`<div class="panel"><span class="pill">ADMIN GLOBAL</span><h1>Painel Owner</h1><div class="cards" style="padding:0;grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card"><h3>👤 Usuários</h3><h2>1</h2><p class="muted">Gerenciar contas e suspensões.</p></div><div class="card"><h3>🏠 Servidores</h3><h2>3</h2><p class="muted">Gerenciar comunidades.</p></div><div class="card"><h3>🚩 Denúncias</h3><h2>0</h2><p class="muted">Revisar denúncias.</p></div><div class="card"><h3>📊 Logs</h3><h2>12</h2><p class="muted">Auditoria administrativa.</p></div></div><div class="card" style="margin-top:14px"><h3>⚠️ Segurança</h3><p class="muted">Este painel é apenas uma interface local. Em produção, a autorização Owner deve ser verificada no backend com sessões seguras, RBAC e auditoria; nunca apenas por código no cliente.</p></div></div>`}
function modal(type){if(type==='server'){$('#modalbox').innerHTML=`<h2>Criar servidor</h2><p class="muted">Crie uma comunidade para começar.</p><div class="field"><span>Nome</span><input id="srv" placeholder="Minha comunidade"></div><br><div class="row"><button class="primary" onclick="createServer()">Criar</button><button class="iconbtn" onclick="closeModal()">Cancelar</button></div>`}$('#modal').classList.add('show')}
function createServer(){let n=$('#srv').value.trim()||'Novo servidor';$('#serverName').textContent=n;closeModal();toast('Servidor criado localmente: '+n)}
function closeModal(){$('#modal').classList.remove('show')}
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
home();
</script></body></html>
