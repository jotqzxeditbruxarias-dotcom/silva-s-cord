<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Silva's Cord</title>
<style>
:root{--bg:#080910;--p:#10121a;--p2:#181b25;--line:#292d3a;--txt:#f5f6fa;--muted:#9ba2b3;--a:#8b5cf6;--b:#4f8cff;--ok:#35d07f;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.muted{color:var(--muted)}
.auth{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#28184c,transparent 48%),var(--bg)}.authbox{width:min(440px,100%);background:#10121af5;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 20px 70px #0008}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.logo,.avatar{background:linear-gradient(135deg,var(--a),var(--b))}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:900}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input,.field textarea,.field select{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:13px;color:white;outline:none}.primary{background:linear-gradient(135deg,var(--a),#686cff);border:0;color:#fff;padding:12px 16px;border-radius:10px;font-weight:800}.ghost{background:transparent;border:1px solid var(--line);color:white;padding:11px 14px;border-radius:10px}.full{width:100%}
.app{height:100dvh;display:flex;overflow:hidden;max-width:1280px;margin:auto}.rail{width:70px;background:#07080d;border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px}.server{width:54px;height:54px;border:0;border-radius:16px;background:var(--p2);color:white;font-weight:900}.server.active,.server:hover{background:linear-gradient(135deg,var(--a),var(--b))}.add{color:var(--ok)}
.side{width:245px;background:var(--p);border-right:1px solid var(--line);display:flex;flex-direction:column}.sidehead{padding:18px;font-weight:900;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section{padding:14px 12px 6px;color:var(--muted);font-size:11px;text-transform:uppercase}.item{width:100%;border:0;background:transparent;color:var(--muted);padding:10px 15px;text-align:left;border-radius:8px}.item:hover,.item.active{background:var(--p2);color:white}.empty{padding:15px;color:var(--muted);line-height:1.5}.sidebottom{margin-top:auto;background:#0c0e14;padding:10px;display:flex;gap:9px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;object-fit:cover}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}.top h2{font-size:16px;margin:0}.icon{background:transparent;border:0;color:var(--muted);font-size:19px;padding:8px}.content{flex:1;overflow:auto}.hero{padding:32px 24px;border-bottom:1px solid var(--line);background:radial-gradient(circle at 80% 20%,#2d2050,transparent 40%)}.hero h1{font-size:31px;margin:8px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:17px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#211b3b;color:#d0c4ff;font-size:11px}.panel{padding:20px;max-width:900px}.messages{padding:16px 20px}.msg{display:flex;gap:11px;margin:17px 0}.msgbody{max-width:850px}.msghead{font-weight:800}.msghead span{color:var(--muted);font-size:11px;font-weight:400;margin-left:7px}.bubble{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}.composer{display:flex;gap:8px;padding:10px;background:#0c0e14;border-top:1px solid var(--line)}.composer input{flex:1;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:13px;color:white;outline:none}.send{background:var(--a);border:0;border-radius:10px;color:white;padding:0 18px}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px;z-index:50}.modal.show{display:grid}.modalbox{width:min(500px,100%);max-height:90dvh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:20px}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#202532;border:1px solid var(--line);padding:11px 15px;border-radius:10px;display:none;z-index:80}.bottom{display:none}
.video{width:100%;background:#050608;border-radius:12px;border:1px solid var(--line);max-height:48dvh}.videoGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.rail{width:62px}.side{position:absolute;left:62px;top:0;bottom:62px;z-index:20;transform:translateX(-110%);transition:.2s;box-shadow:10px 0 35px #0008}.side.open{transform:none}.cards{grid-template-columns:1fr;padding:14px}.bottom{display:flex;height:62px;border-top:1px solid var(--line);background:#0c0e14;justify-content:space-around;align-items:center}.bottom button{background:none;border:0;color:var(--muted);font-size:11px}.bottom b{display:block;font-size:19px}.hero{padding:24px 17px}.panel{padding:15px}.messages{padding:12px}.videoGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="modalbox" class="modalbox"></div></div>
<div id="toast" class="toast"></div>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* COLOQUE A URL E A CHAVE PUBLICÁVEL DO SEU PROJETO SUPABASE AQUI. */
const SUPABASE_URL="COLE_AQUI_SUA_SUPABASE_URL";
const SUPABASE_ANON_KEY="COLE_AQUI_SUA_SUPABASE_ANON_KEY";

const configured=SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length>30;
let sb=null,user=null,profile=null,serverId=null,channelId=null,msgSub=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function toast(t){$("#toast").textContent=t;$("#toast").style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>$("#toast").style.display="none",2300)}
function modal(h){$("#modalbox").innerHTML=h;$("#modal").classList.add("show")} function closeModal(){$("#modal").classList.remove("show")}
window.closeModal=closeModal;

function setup(){
$("#root").innerHTML=`<main class="auth"><div class="authbox"><div class="brand"><div class="logo">SC</div><div><h1>Silva's Cord</h1><div class="muted">Configuração do backend</div></div></div><h2>Backend necessário</h2><p class="muted">A interface está pronta. Para contas, mensagens entre celulares, amigos e servidores reais, conecte um projeto Supabase.</p><div class="card"><b>1.</b> Crie um projeto Supabase gratuito.<br><b>2.</b> Execute <b>supabase_schema.sql</b> deste pacote.<br><b>3.</b> Coloque a URL e a chave pública no topo deste arquivo.<br><b>4.</b> Publique novamente no GitHub Pages.</div><p class="muted">Nenhum usuário, amigo, servidor ou mensagem fictícia será criado.</p></div></main>`;
}
function auth(mode="login"){
$("#root").innerHTML=`<main class="auth"><div class="authbox"><div class="brand"><div class="logo">SC</div><div><h1>Silva's Cord</h1><div class="muted">Comunidades e conversas</div></div></div>
${mode==="login"?`<h2>Entrar</h2><form id="authf"><label class="field">E-mail<input id="email" type="email" required></label><label class="field">Senha<input id="pass" type="password" required></label><button class="primary full">Entrar</button></form><br><button class="ghost full" id="switch">Criar conta</button>`:
`<h2>Criar conta</h2><p class="muted">A conta começa sem amigos, servidores e mensagens.</p><form id="authf"><label class="field">@Nickname único<input id="nick" pattern="[a-z0-9_]{3,24}" placeholder="seu_nick" required></label><label class="field">Nome de exibição<input id="display" maxlength="40" required></label><label class="field">E-mail<input id="email" type="email" required></label><label class="field">Senha<input id="pass" type="password" minlength="8" required></label><label class="field">Avatar<input id="avatar" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="primary full">Criar conta</button></form><br><button class="ghost full" id="switch">Já tenho conta</button>`}</div></main>`;
$("#authf").onsubmit=mode==="login"?login:signup;$("#switch").onclick=()=>auth(mode==="login"?"signup":"login");
}
async function login(e){e.preventDefault();let {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pass").value});if(error)toast(error.message)}
async function signup(e){
e.preventDefault();let nick=$("#nick").value.trim().toLowerCase(),display=$("#display").value.trim();
let {data,error}=await sb.auth.signUp({email:$("#email").value.trim(),password:$("#pass").value});if(error){toast(error.message);return}
if(!data.user){toast("Confirme seu e-mail para entrar.");return}
let {error:pe}=await sb.from("profiles").insert({id:data.user.id,nickname:nick,display_name:display});
if(pe){toast(pe.message);return}
let f=$("#avatar").files?.[0];if(f){let ext=f.name.split(".").pop();let path=`${data.user.id}/avatar.${ext}`;let up=await sb.storage.from("avatars").upload(path,f,{upsert:true});if(!up.error){let u=sb.storage.from("avatars").getPublicUrl(path);await sb.from("profiles").update({avatar_url:u.data.publicUrl}).eq("id",data.user.id)}}
toast("Conta criada.");if(!data.session)auth("login");
}
async function load(){
let {data:p,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();if(error||!p){auth("signup");return}profile=p;shell();await loadServers();
}
function shell(){
$("#root").innerHTML=`<div class="app"><aside class="rail"><button class="server active" onclick="home()">SC</button><div id="servers"></div><button class="server add" onclick="newServer()">+</button></aside>
<aside id="side" class="side"><div class="sidehead" id="serverName">Silva's Cord</div><div class="section">Canais</div><div id="channels"><div class="empty">Nenhum servidor selecionado.</div></div><div class="section">Amigos</div><div id="friendMini"><div class="empty">Nenhum amigo ainda.</div></div><div class="sidebottom"><div class="avatar">${esc(profile.display_name[0])}</div><div style="min-width:0"><b>${esc(profile.display_name)}</b><div class="muted">@${esc(profile.nickname)}</div></div><button class="icon" onclick="settings()">⚙</button></div></aside>
<main class="main"><header class="top"><button class="icon" onclick="toggleSide()">☰</button><h2 id="title">Início</h2><div class="spacer"></div><button class="icon" onclick="friends()">👥</button><button class="icon" onclick="profilePage()">◉</button></header><div id="content" class="content"></div><nav class="bottom"><button onclick="home()"><b>⌂</b>Início</button><button onclick="toggleSide()"><b>☰</b>Canais</button><button onclick="friends()"><b>♧</b>Amigos</button><button onclick="settings()"><b>⚙</b>Config.</button></nav></main></div>`;
home();
}
function toggleSide(){$("#side").classList.toggle("open")}window.toggleSide=toggleSide;
function home(){$("#title").textContent="Início";$("#content").innerHTML=`<section class="hero"><span class="badge">SILVA'S CORD</span><h1>Bem-vindo, ${esc(profile.display_name)}.</h1><p class="muted">Seu espaço começa vazio. Crie um servidor ou procure pessoas pelo @nickname.</p><div class="row"><button class="primary" onclick="newServer()">＋ Criar servidor</button><button class="ghost" onclick="friends()">Adicionar amigo</button></div></section><div class="cards"><div class="card"><h3>💬 Mensagens</h3><p class="muted">Chat persistente e sincronizado por Realtime.</p></div><div class="card"><h3>👥 Amigos</h3><p class="muted">Solicitações só viram amizade depois de aceitas.</p></div><div class="card"><h3>📞 Voz e vídeo</h3><p class="muted">Base WebRTC para microfone, câmera e compartilhamento de tela.</p></div></div>`}window.home=home;
async function loadServers(){let {data}=await sb.from("server_members").select("server_id,servers(id,name,icon_url)").eq("user_id",user.id);$("#servers").innerHTML="";(data||[]).forEach(x=>{let b=document.createElement("button");b.className="server";b.textContent=(x.servers?.name||"?")[0].toUpperCase();b.onclick=()=>openServer(x.server_id,x.servers?.name);$("#servers").appendChild(b)})}
function newServer(){modal(`<h2>Criar servidor</h2><label class="field">Nome<input id="sn" maxlength="60" required></label><label class="field">Descrição<textarea id="sd" maxlength="240"></textarea></label><div class="row"><button class="primary" onclick="createServer()">Criar</button><button class="ghost" onclick="closeModal()">Cancelar</button></div>`)}window.newServer=newServer;
async function createServer(){let name=$("#sn").value.trim(),description=$("#sd").value.trim();if(!name)return;let {data,error}=await sb.rpc("create_server",{p_name:name,p_description:description});if(error){toast(error.message);return}closeModal();await loadServers();openServer(data,name)}
async function openServer(id,name){serverId=id;$("#serverName").textContent=name||"Servidor";let {data}=await sb.from("channels").select("*").eq("server_id",id).order("position");$("#channels").innerHTML=(data||[]).map(c=>`<button class="item" onclick="openChannel('${c.id}','${esc(c.name)}','${c.type}')">${c.type==="voice"?"🔊":"#"} ${esc(c.name)}</button>`).join("")||'<div class="empty">Nenhum canal.</div>';if(data?.[0])openChannel(data[0].id,data[0].name,data[0].type)}
async function openChannel(id,name,type){channelId=id;$("#title").textContent=(type==="voice"?"🔊 ":"# ")+name;if(type==="voice"){voice(name);return}$("#content").innerHTML=`<div class="messages" id="messages"><div class="muted">Carregando...</div></div><form class="composer" id="composer"><input id="message" maxlength="4000" placeholder="Mensagem em #${esc(name)}"><button class="send">Enviar</button></form>`;await refreshMessages();if(msgSub)sb.removeChannel(msgSub);msgSub=sb.channel("msg-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"channel_id=eq."+id},()=>refreshMessages()).subscribe();$("#composer").onsubmit=sendMessage}
window.openServer=openServer;window.openChannel=openChannel;
async function refreshMessages(){let {data}=await sb.from("messages").select("id,content,created_at,user_id,profiles(display_name,nickname)").eq("channel_id",channelId).order("created_at",{ascending:true}).limit(100);$("#messages").innerHTML=(data||[]).map(m=>`<div class="msg"><div class="avatar">${esc((m.profiles?.display_name||"?")[0])}</div><div class="msgbody"><div class="msghead">${esc(m.profiles?.display_name||"Usuário")} <span>${new Date(m.created_at).toLocaleString("pt-BR")}</span></div><div class="bubble">${esc(m.content)}</div></div></div>`).join("")||'<div class="muted">Nenhuma mensagem ainda.</div>';$("#messages").scrollTop=999999}
async function sendMessage(e){e.preventDefault();let v=$("#message").value.trim();if(!v)return;let {error}=await sb.from("messages").insert({channel_id:channelId,user_id:user.id,content:v});if(error)toast(error.message);else $("#message").value=""}
async function friends(){$("#title").textContent="Amigos";$("#content").innerHTML=`<div class="panel"><h1>Amigos</h1><div class="card"><h3>Adicionar por @nickname</h3><div class="row"><input id="findNick" placeholder="@nickname" style="flex:1;background:var(--p2);border:1px solid var(--line);padding:12px;border-radius:9px;color:white"><button class="primary" onclick="findUser()">Pesquisar</button></div><div id="result"></div></div><div class="card" style="margin-top:14px"><h3>Solicitações recebidas</h3><div id="requests" class="muted">Carregando...</div></div><div class="card" style="margin-top:14px"><h3>Amigos</h3><div id="friendlist" class="muted">Carregando...</div></div></div>`;await loadFriends()}
window.friends=friends;
async function findUser(){let n=$("#findNick").value.replace(/^@/,"").trim().toLowerCase();if(!n)return;let {data,error}=await sb.from("profiles").select("id,nickname,display_name").eq("nickname",n).maybeSingle();$("#result").innerHTML=error?`<p class="muted">${esc(error.message)}</p>`:data&&data.id!==user.id?`<div class="row" style="margin-top:14px"><div class="avatar">${esc(data.display_name[0])}</div><div style="flex:1"><b>${esc(data.display_name)}</b><div class="muted">@${esc(data.nickname)}</div></div><button class="primary" onclick="requestFriend('${data.id}')">Adicionar</button></div>`:'<p class="muted">Usuário não encontrado.</p>'}
async function requestFriend(id){let {error}=await sb.from("friend_requests").insert({sender_id:user.id,receiver_id:id});toast(error?"Não foi possível enviar: "+error.message:"Solicitação enviada.");}
async function loadFriends(){let r=await sb.from("friend_requests").select("id,sender_id,profiles:sender_id(display_name,nickname)").eq("receiver_id",user.id).eq("status","pending");$("#requests").innerHTML=(r.data||[]).map(x=>`<div class="row" style="margin:10px 0"><span style="flex:1"><b>${esc(x.profiles?.display_name)}</b> <span class="muted">@${esc(x.profiles?.nickname)}</span></span><button class="primary" onclick="acceptReq('${x.id}')">Aceitar</button><button class="ghost" onclick="declineReq('${x.id}')">Recusar</button></div>`).join("")||"Nenhuma solicitação.";let f=await sb.from("friendships").select("user_id,profiles:user_id(display_name,nickname)").eq("friend_id",user.id);$("#friendlist").innerHTML=(f.data||[]).map(x=>`<div class="row" style="margin:10px 0"><span style="flex:1"><b>${esc(x.profiles?.display_name)}</b><div class="muted">@${esc(x.profiles?.nickname)}</div></span></div>`).join("")||"Você ainda não tem amigos."}
async function acceptReq(id){let {error}=await sb.rpc("accept_friend_request",{p_request_id:id});toast(error?"Erro: "+error.message:"Amizade aceita.");loadFriends()}async function declineReq(id){let {error}=await sb.from("friend_requests").update({status:"declined"}).eq("id",id);toast(error?"Erro: "+error.message:"Recusada.");loadFriends()}
window.findUser=findUser;window.requestFriend=requestFriend;window.acceptReq=acceptReq;window.declineReq=declineReq;
function profilePage(){$("#title").textContent="Perfil";$("#content").innerHTML=`<div class="panel"><h1>${esc(profile.display_name)}</h1><div class="card"><div class="row"><div class="avatar">${esc(profile.display_name[0])}</div><div><b>@${esc(profile.nickname)}</b><div class="muted">${esc(profile.status||"online")}</div></div></div><p>${esc(profile.bio||"")}</p><span class="badge">${esc(profile.badge||"Membro")}</span></div></div>`}window.profilePage=profilePage;
function settings(){$("#title").textContent="Configurações";$("#content").innerHTML=`<div class="panel"><h1>Configurações</h1><div class="card"><label class="field">Nome de exibição<input id="dn" value="${esc(profile.display_name)}"></label><label class="field">Biografia<textarea id="bio" maxlength="280">${esc(profile.bio||"")}</textarea></label><label class="field">Status<select id="st"><option value="online">Online</option><option value="away">Ausente</option><option value="busy">Ocupado</option><option value="invisible">Invisível</option></select></label><button class="primary" onclick="saveProfile()">Salvar</button></div><div class="card" style="margin-top:14px"><h3>Segurança</h3><p class="muted">As permissões importantes são aplicadas no banco com RLS. Nunca use service_role no frontend.</p><button class="ghost" onclick="logout()">Sair</button></div></div>`;$("#st").value=profile.status||"online"}window.settings=settings;
async function saveProfile(){let patch={display_name:$("#dn").value.trim(),bio:$("#bio").value.trim(),status:$("#st").value};let {error}=await sb.from("profiles").update(patch).eq("id",user.id);if(error)toast(error.message);else{profile={...profile,...patch};toast("Perfil salvo.")}}
async function logout(){await sb.auth.signOut()}window.saveProfile=saveProfile;window.logout=logout;
async function voice(name){$("#content").innerHTML=`<div class="panel"><h1>🔊 ${esc(name)}</h1><p class="muted">WebRTC usa microfone/câmera reais quando o navegador permitir.</p><div class="videoGrid"><video id="local" class="video" autoplay muted playsinline></video><video id="remote" class="video" autoplay playsinline></video></div><div class="row" style="margin-top:12px"><button class="primary" onclick="startMedia(false)">🎙️ Voz</button><button class="primary" onclick="startMedia(true)">📹 Vídeo</button><button class="ghost" onclick="screenShare()">🖥️ Compartilhar tela</button><button class="ghost" onclick="stopMedia()">Encerrar</button></div></div>`}
let pc=null,stream=null;
async function startMedia(video){try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video});$("#local").srcObject=stream;pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$("#remote").srcObject=e.streams[0];toast("Mídia local ativada. A sinalização/entrada de participantes depende do backend de chamadas.");}catch(e){toast("Permissão de microfone/câmera negada ou indisponível.")}}
async function screenShare(){if(!pc){toast("Inicie uma chamada primeiro.");return}try{let s=await navigator.mediaDevices.getDisplayMedia({video:true});let sender=pc.getSenders().find(x=>x.track?.kind==="video");if(sender)sender.replaceTrack(s.getVideoTracks()[0]);s.getVideoTracks()[0].onended=()=>stream?.getVideoTracks()[0]&&sender?.replaceTrack(stream.getVideoTracks()[0]);}catch(e){toast("Compartilhamento não disponível neste navegador.")}}
function stopMedia(){stream?.getTracks().forEach(t=>t.stop());pc?.close();pc=null;toast("Chamada encerrada")}
window.startMedia=startMedia;window.screenShare=screenShare;window.stopMedia=stopMedia;

if(!configured())setup();else{sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user)load();else auth()});sb.auth.getSession().then(({data})=>{user=data.session?.user||null;if(user)load();else auth()})}
</script>
</body></html>
